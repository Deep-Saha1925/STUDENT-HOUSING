<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --accent: #ff5e62; --accent-2: #ff9966;
            --bg: #faf7f4; --card-bg: #fff; --text: #1a1a1a; --text-muted: #777;
            --border: rgba(0,0,0,0.08); --nav-bg: #1a1a1a; --shadow: 0 4px 24px rgba(0,0,0,0.07);
        }
        [data-theme="dark"] {
            --bg: #111112; --card-bg: #1e1e22; --text: #f0ede8; --text-muted: #888;
            --border: rgba(255,255,255,0.07); --nav-bg: #0d0d0e; --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .navbar { background: var(--nav-bg) !important; padding: 14px 28px; }
        .navbar-brand { font-family: 'DM Serif Display', serif; color: #f0ede8 !important; }
        .btn-nav {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: #fff !important; padding: 7px 14px; font-size: .82rem; border-radius: 8px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
        }
        .card-box {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
            padding: 32px 28px; box-shadow: var(--shadow); max-width: 520px; margin: 48px auto;
        }
        .card-box h2 { font-family: 'DM Serif Display', serif; font-weight: 400; }
        .muted { color: var(--text-muted); font-size: .9rem; }
        .contact-row {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-top: 12px;
            border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text);
        }
        .contact-row:hover { border-color: var(--accent); color: var(--text); }
        .contact-row i { font-size: 1.3rem; color: var(--accent); }
        .contact-row small { display: block; color: var(--text-muted); }
        .btn-accent {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 22px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff;
            border: 0; font-weight: 600; padding: 10px 20px; border-radius: 9px; text-decoration: none;
        }
        .btn-accent:hover { color: #fff; opacity: .92; }
    </style>
    <script>document.documentElement.dataset.theme = localStorage.getItem('sh-theme') || 'light';</script>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid d-flex align-items-center gap-3">
        <a th:href="@{/}" class="navbar-brand">Student Housing</a>
        <a href="javascript:history.back()" class="btn-nav ms-auto"><i class="bi bi-arrow-left"></i> Back</a>
    </div>
</nav>

<div class="card-box">
    <h2 class="mb-1"><i class="bi bi-headset"></i> Contact Admin</h2>
    <p class="muted">Need help with your account, a listing or a booking? Reach the admin here.</p>

    <a class="contact-row" th:href="'mailto:' + ${user.email}">
        <i class="bi bi-envelope-fill"></i>
        <span><small>Email</small><span th:text="${user.email}">admin@example.com</span></span>
    </a>

    <a class="contact-row" th:if="${user.phone != null and !user.phone.isEmpty()}" th:href="'tel:' + ${user.phone}">
        <i class="bi bi-telephone-fill"></i>
        <span><small>Phone</small><span th:text="${user.phone}">+91 00000 00000</span></span>
    </a>

    <a th:if="${isOwner}" th:href="@{/owner/reports}" class="btn-accent">
        <i class="bi bi-flag"></i> Send a report to admin
    </a>
</div>

</body>
</html>
