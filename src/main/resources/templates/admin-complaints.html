<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Issues - Admin</title>
    <th:block th:replace="~{fragments/report-ui :: styles}"></th:block>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid d-flex align-items-center gap-3">
        <a th:href="@{/admin/dashboard}" class="navbar-brand">Admin Panel</a>
        <a th:href="@{/admin/dashboard}" class="btn-nav ms-auto"><i class="bi bi-arrow-left"></i> Dashboard</a>
    </div>
</nav>

<div class="container py-4" style="max-width: 1100px;">

    <h2 class="page-title mb-1">Student Issues</h2>
    <p class="text-muted-2 mb-3">Issues raised by students about properties they booked. Open one to reply or send it to the owner.</p>

    <div class="d-flex flex-wrap gap-2 mb-3">
        <a th:href="@{/admin/complaints}" class="btn btn-sm"
           th:classappend="${selected == null} ? 'btn-dark' : 'btn-outline-secondary'">All</a>
        <a th:each="s : ${statuses}" th:href="@{/admin/complaints(status=${s})}" class="btn btn-sm"
           th:classappend="${selected == s} ? 'btn-dark' : 'btn-outline-secondary'" th:text="${s.label}"></a>
    </div>

    <div class="panel">
        <div th:if="${complaints.isEmpty()}" class="text-muted-2">No issues here.</div>
        <div class="table-responsive" th:if="${!complaints.isEmpty()}">
            <table class="table align-middle mb-0">
                <thead><tr><th>Issue</th><th>Student</th><th>Property</th><th>Type</th><th>Status</th><th>Last update</th></tr></thead>
                <tbody>
                <tr th:each="c : ${complaints}">
                    <td>
                        <span class="dot-unread" th:if="${c.adminUnread}" title="Needs your attention"></span>
                        <a class="row-link" th:href="@{'/admin/complaints/' + ${c.id}}" th:text="${c.subject}"></a>
                    </td>
                    <td th:text="${c.student.fullName}"></td>
                    <td th:text="${c.propertyTitle}"></td>
                    <td th:text="${c.category.label}"></td>
                    <td><span th:class="'st st-' + ${c.status}" th:text="${c.status.label}"></span></td>
                    <td class="text-muted-2" th:text="${#temporals.format(c.updatedAt, 'dd MMM yyyy, HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
