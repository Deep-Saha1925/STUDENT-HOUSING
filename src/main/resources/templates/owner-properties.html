<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Owner Dashboard</title>

    <link rel="icon"
          type="image/svg+xml"
          th:href="@{/favicon.svg}">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">


    <style>

        /* =========================================================
           THEME VARIABLES
        ========================================================= */

        :root {

            --accent: #ff5e62;
            --accent-2: #ff9966;

            --bg: #f5f2ef;
            --bg-alt: #ffffff;

            --text: #1a1a1a;
            --text-muted: #777;

            --border: rgba(0, 0, 0, 0.08);

            --nav-bg: #1a1a1a;

            --card-bg: #ffffff;

            --card-shadow:
                    0 4px 24px rgba(0, 0, 0, 0.07);

            --thead-bg: #1a1a1a;
            --thead-text: #f0ede8;

            --row-hover: #fdf6f3;

            --input-bg: #f5f2ef;
        }


        [data-theme="dark"] {

            --bg: #111112;
            --bg-alt: #18181b;

            --text: #f0ede8;
            --text-muted: #888;

            --border: rgba(255, 255, 255, 0.07);

            --nav-bg: #0d0d0e;

            --card-bg: #1e1e22;

            --card-shadow:
                    0 4px 24px rgba(0, 0, 0, 0.4);

            --thead-bg: #111112;
            --thead-text: #f0ede8;

            --row-hover: #26252a;

            --input-bg: #26252a;
        }


        /* =========================================================
           GLOBAL
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family: 'DM Sans', sans-serif;

            background: var(--bg);

            color: var(--text);

            min-height: 100vh;

            margin: 0;

            transition:
                    background 0.35s ease,
                    color 0.35s ease;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        .navbar {

            background: var(--nav-bg) !important;

            padding: 14px 24px;

            border-bottom:
                    1px solid rgba(255, 255, 255, 0.05);

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .navbar-brand {

            font-family:
                    'DM Serif Display',
                    serif;

            font-size: 1.3rem;

            color: #f0ede8 !important;

            display: flex;

            align-items: center;

            gap: 9px;

            letter-spacing: -0.3px;

            text-decoration: none;
        }


        .brand-dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background:
                    linear-gradient(
                            135deg,
                            var(--accent-2),
                            var(--accent)
                    );

            flex-shrink: 0;

            display: inline-block;
        }


        .welcome-text {

            color:
                    rgba(255, 255, 255, 0.65);

            font-size: 0.88rem;

            font-weight: 400;
        }


        .welcome-text strong {

            color: #fff;

            font-weight: 600;
        }


        /* =========================================================
           NAV BUTTONS
        ========================================================= */

        .btn-nav {

            background:
                    rgba(255, 255, 255, 0.08);

            border:
                    1px solid rgba(255, 255, 255, 0.12);

            color: #fff !important;

            padding: 7px 14px;

            font-size: 0.82rem;

            font-weight: 500;

            border-radius: 8px;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            gap: 6px;

            transition: all 0.2s;

            white-space: nowrap;
        }


        .btn-nav:hover {

            background:
                    rgba(255, 255, 255, 0.15);

            border-color:
                    rgba(255, 255, 255, 0.25);
        }


        .btn-logout-nav {

            background:
                    rgba(255, 94, 98, 0.15);

            border:
                    1px solid rgba(255, 94, 98, 0.3);

            color: #ff7c7e !important;

            padding: 7px 14px;

            font-size: 0.82rem;

            font-weight: 500;

            border-radius: 8px;

            display: inline-flex;

            align-items: center;

            gap: 6px;

            cursor: pointer;

            transition: all 0.2s;

            font-family:
                    'DM Sans',
                    sans-serif;

            white-space: nowrap;
        }


        .btn-logout-nav:hover {

            background:
                    rgba(255, 94, 98, 0.28);

            border-color:
                    rgba(255, 94, 98, 0.5);

            color: #fff !important;
        }


        /* =========================================================
           THEME TOGGLE
        ========================================================= */

        .theme-toggle {

            width: 36px;

            height: 36px;

            border-radius: 8px;

            border:
                    1px solid rgba(255, 255, 255, 0.12);

            background:
                    rgba(255, 255, 255, 0.07);

            color: #fff;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            font-size: 0.95rem;

            transition: all 0.25s;

            flex-shrink: 0;
        }


        .theme-toggle:hover {

            background:
                    rgba(255, 255, 255, 0.15);

            transform: rotate(20deg);
        }


        /* =========================================================
           PAGE HEADER
        ========================================================= */

        .page-header {

            padding: 42px 0 28px;

            text-align: center;
        }


        .page-header h2 {

            font-family:
                    'DM Serif Display',
                    serif;

            font-size:
                    clamp(1.7rem, 3vw, 2.3rem);

            font-weight: 400;

            color: var(--text);

            letter-spacing: -0.5px;

            margin-bottom: 6px;
        }


        .page-header p {

            color:
                    var(--text-muted) !important;

            font-size: 0.92rem;

            font-weight: 300;

            margin: 0;
        }


        /* =========================================================
           THEME TEXT
        ========================================================= */

        .container p,
        .container h2,
        .container h3,
        .container h4,
        .container label,
        .container span:not(.badge-rent) {

            color: var(--text);
        }


        .container .text-muted {

            color:
                    var(--text-muted) !important;
        }


        /* =========================================================
           DESKTOP DASHBOARD CARD
        ========================================================= */

        .dash-card {

            background: var(--card-bg);

            border:
                    1px solid var(--border);

            border-radius: 16px;

            box-shadow:
                    var(--card-shadow);

            padding: 28px;

            transition:
                    background 0.35s ease;
        }


        /* =========================================================
           TABLE
        ========================================================= */

        .table {

            color: var(--text);

            margin: 0;

            width: 100%;
        }


        .table thead tr {

            background:
                    var(--thead-bg);
        }


        .table thead th {

            background:
                    var(--thead-bg) !important;

            color:
                    var(--thead-text) !important;

            font-weight: 500;

            font-size: 0.82rem;

            letter-spacing: 0.5px;

            text-transform: uppercase;

            padding: 14px 16px;

            border: none;
        }


        .table thead th:first-child {

            border-radius:
                    10px 0 0 10px;
        }


        .table thead th:last-child {

            border-radius:
                    0 10px 10px 0;
        }


        .table tbody tr {

            border-bottom:
                    1px solid var(--border);

            transition:
                    background 0.15s;
        }


        .table tbody tr:hover {

            background:
                    var(--row-hover);
        }


        .table tbody tr:last-child {

            border-bottom: none;
        }


        .table tbody td {

            padding: 14px 16px;

            font-size: 0.88rem;

            vertical-align: middle;

            border: none;

            color: var(--text);
        }


        /* =========================================================
           RENT BADGES
        ========================================================= */

        .rent-options {

            display: flex;

            flex-wrap: wrap;

            justify-content: flex-start;

            gap: 4px;
        }


        .badge-rent {

            background:
                    linear-gradient(
                            135deg,
                            #22c55e,
                            #16a34a
                    );

            color: #fff !important;

            font-size: 0.8rem;

            padding: 5px 10px;

            border-radius: 6px;

            font-weight: 600;

            display: inline-block;

            margin: 0;
        }


        /* =========================================================
           AVAILABILITY
        ========================================================= */

        .form-check-input {

            width: 38px;

            height: 20px;

            cursor: pointer;
        }


        .form-check-input:checked {

            background-color:
                    var(--accent);

            border-color:
                    var(--accent);
        }


        /* =========================================================
           EDIT BUTTON
        ========================================================= */

        .btn-edit {

            background:
                    rgba(255, 153, 102, 0.12);

            border:
                    1px solid rgba(255, 153, 102, 0.3);

            color: #d97706;

            padding: 6px 14px;

            font-size: 0.8rem;

            font-weight: 500;

            border-radius: 7px;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            gap: 5px;

            transition: all 0.2s;

            font-family:
                    'DM Sans',
                    sans-serif;

            white-space: nowrap;
        }


        .btn-edit:hover {

            background:
                    rgba(255, 153, 102, 0.25);

            border-color:
                    rgba(255, 153, 102, 0.5);

            color: #b45309;
        }


        [data-theme="dark"] .btn-edit {

            color: #fbbf24;
        }


        [data-theme="dark"] .btn-edit:hover {

            color: #fcd34d;
        }


        /* =========================================================
           BOOKINGS BUTTON
        ========================================================= */

        .btn-bookings {

            background:
                    rgba(59, 130, 246, 0.12);

            border:
                    1px solid rgba(59, 130, 246, 0.3);

            color: #2563eb;

            padding: 6px 14px;

            font-size: 0.8rem;

            font-weight: 500;

            border-radius: 7px;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            gap: 5px;

            transition: all 0.2s;

            font-family:
                    'DM Sans',
                    sans-serif;

            margin-left: 6px;

            position: relative;

            white-space: nowrap;
        }


        .btn-bookings:hover {

            background:
                    rgba(59, 130, 246, 0.25);

            border-color:
                    rgba(59, 130, 246, 0.5);

            color: #1d4ed8;
        }


        [data-theme="dark"] .btn-bookings {

            color: #60a5fa;
        }


        [data-theme="dark"] .btn-bookings:hover {

            color: #93c5fd;
        }


        /* =========================================================
           NOTIFICATION BADGE
        ========================================================= */

        .notif-dot {

            position: absolute;

            top: -7px;

            right: -7px;

            background: #ef4444;

            color: #fff;

            font-size: 0.64rem;

            font-weight: 700;

            min-width: 17px;

            height: 17px;

            border-radius: 50%;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 0 3px;

            line-height: 1;

            box-shadow:
                    0 0 0 2px var(--card-bg);

            animation:
                    notif-pulse 1.8s
                    ease-in-out infinite;
        }


        @keyframes notif-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }


        @media (prefers-reduced-motion: reduce) {

            .notif-dot {
                animation: none;
            }
        }


        /* =========================================================
           ADD PROPERTY BUTTON
        ========================================================= */

        .btn-add {

            background:
                    linear-gradient(
                            135deg,
                            var(--accent-2),
                            var(--accent)
                    );

            border: none;

            color: #fff !important;

            padding: 12px 28px;

            font-size: 0.92rem;

            font-weight: 600;

            border-radius: 10px;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            transition: all 0.25s;

            box-shadow:
                    0 6px 20px
                    rgba(255, 94, 98, 0.28);

            font-family:
                    'DM Sans',
                    sans-serif;
        }


        .btn-add:hover {

            transform:
                    translateY(-2px);

            box-shadow:
                    0 10px 28px
                    rgba(255, 94, 98, 0.36);

            opacity: 0.95;
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty-state {

            text-align: center;

            padding: 50px 20px;

            color: var(--text-muted);
        }


        .empty-state i {

            font-size: 2.5rem;

            margin-bottom: 12px;

            opacity: 0.4;
        }


        /* =========================================================
           BOOTSTRAP TABLE OVERRIDES
        ========================================================= */

        .table > :not(caption) > * > * {

            background-color:
                    transparent !important;

            color:
                    var(--text) !important;

            border-color:
                    var(--border) !important;
        }


        .table tbody td,
        .table tbody td span,
        .table tbody td a,
        .table tbody tr td {

            color:
                    var(--text) !important;
        }


        .badge-rent {

            color: #fff !important;
        }


        .table-responsive {

            background:
                    var(--card-bg);

            border-radius: 10px;

            transition:
                    background 0.35s;
        }


        /* =========================================================
           NAVBAR WELCOME TEXT
        ========================================================= */

        .welcome-text,
        .welcome-text strong {

            color:
                    rgba(255, 255, 255, 0.85) !important;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 991.98px) {

            .navbar {

                padding:
                        12px 16px;
            }


            .navbar .container-fluid {

                flex-wrap: wrap;

                row-gap: 10px;
            }


            .navbar-brand {

                font-size: 1.15rem;
            }


            .navbar .ms-auto {

                width: 100%;

                display: flex;

                justify-content:
                        space-between;

                align-items: center;
            }


            .welcome-text {

                font-size: 0.8rem;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 575.98px) {


            /* -----------------------------
               BODY
            ----------------------------- */

            body {

                overflow-x: hidden;
            }


            /* -----------------------------
               NAVBAR
            ----------------------------- */

            .navbar {

                padding:
                        10px 12px;
            }


            .navbar .container-fluid {

                gap: 8px !important;
            }


            .navbar-brand {

                font-size: 1.05rem;
            }


            .navbar-brand span:not(.brand-dot) {

                display: none;
            }


            .navbar .ms-auto {

                width: auto;

                margin-left: auto !important;

                display: flex;

                align-items: center;

                justify-content: flex-end;

                gap: 7px !important;

                flex-wrap: nowrap;
            }


            .welcome-text {

                position: absolute;

                left: 0;

                right: 0;

                top: 58px;

                text-align: center;

                font-size: 0.72rem;

                padding: 0;

                z-index: 2;
            }


            .btn-nav,
            .btn-logout-nav {

                width: 36px;

                height: 36px;

                padding: 0;

                justify-content: center;

                border-radius: 8px;
            }


            .btn-nav span,
            .btn-logout-nav span,
            .btn-nav .nav-label,
            .btn-logout-nav .nav-label {

                display: none;
            }


            .theme-toggle {

                width: 36px;

                height: 36px;

                flex-shrink: 0;
            }


            /* -----------------------------
               PAGE HEADER
            ----------------------------- */

            .page-header {

                padding:
                        38px 12px 22px;
            }


            .page-header h2 {

                font-size: 1.55rem;

                margin-bottom: 5px;
            }


            .page-header p {

                font-size: 0.8rem;
            }


            /* -----------------------------
               CONTAINER
            ----------------------------- */

            .container {

                width: 100%;

                max-width: 100%;

                padding-left: 12px;

                padding-right: 12px;
            }


            /* =====================================================
               IMPORTANT:
               REMOVE DESKTOP CARD WRAPPER ON MOBILE
            ===================================================== */

            .dash-card {

                padding: 0;

                background: transparent;

                border: none;

                box-shadow: none;
            }


            /* -----------------------------
               TABLE WRAPPER
            ----------------------------- */

            .table-responsive {

                overflow: visible;

                background: transparent;

                border-radius: 0;
            }


            /* -----------------------------
               TABLE
            ----------------------------- */

            .table {

                width: 100%;

                margin: 0;

                border-collapse: separate;

                border-spacing: 0;
            }


            /* Hide desktop headings */

            .table thead {

                display: none;
            }


            /*
             * KEY FIX:
             *
             * Turn tbody into a vertical flex container.
             * The GAP creates physical separation between
             * every property card.
             */

            .table tbody {

                display: flex;

                flex-direction: column;

                gap: 16px;

                width: 100%;
            }


            /* =====================================================
               EACH PROPERTY IS NOW ITS OWN CARD
            ===================================================== */

            .table tbody tr {

                display: block;

                width: 100%;

                margin: 0;

                padding: 0;

                background:
                        var(--card-bg);

                border:
                        1px solid var(--border);

                border-radius: 16px;

                box-shadow:
                        0 4px 16px
                        rgba(0, 0, 0, 0.06);

                overflow: hidden;

                transition:
                        transform 0.2s ease,
                        box-shadow 0.2s ease,
                        background 0.35s ease;
            }


            .table tbody tr:hover {

                background:
                        var(--card-bg);

                transform:
                        translateY(-2px);

                box-shadow:
                        0 7px 22px
                        rgba(0, 0, 0, 0.09);
            }


            /* =====================================================
               CARD CELLS
            ===================================================== */

            .table tbody tr td {

                display: flex;

                width: 100%;

                align-items: center;

                justify-content: space-between;

                min-height: 48px;

                padding:
                        11px 16px;

                background:
                        transparent !important;

                border: none !important;

                border-bottom:
                        1px solid var(--border) !important;

                color:
                        var(--text) !important;

                font-size: 0.86rem;

                text-align: right;

                gap: 16px;
            }


            /* Remove last divider */

            .table tbody tr td:last-child {

                border-bottom:
                        none !important;
            }


            /* =====================================================
               MOBILE LABELS
            ===================================================== */

            .table tbody tr td::before {

                content:
                        attr(data-label);

                flex:
                        0 0 auto;

                color:
                        var(--text-muted);

                font-size:
                        0.68rem;

                font-weight: 600;

                text-transform:
                        uppercase;

                letter-spacing:
                        0.5px;

                text-align:
                        left;
            }


            /* =====================================================
               PROPERTY TITLE
            ===================================================== */

            .table tbody tr td[data-label="Title"] {

                display: block;

                padding:
                        17px 16px 14px;

                font-size:
                        1rem;

                font-weight:
                        600;

                text-align:
                        left;

                background:
                        linear-gradient(
                                135deg,
                                rgba(255, 153, 102, 0.08),
                                rgba(255, 94, 98, 0.04)
                        ) !important;
            }


            .table tbody tr td[data-label="Title"]::before {

                display: block;

                content:
                        "PROPERTY";

                margin-bottom:
                        4px;

                font-size:
                        0.62rem;

                color:
                        var(--accent);
            }


            /* =====================================================
               CITY / AREA
            ===================================================== */

            .table tbody tr td[data-label="City"],
            .table tbody tr td[data-label="Area"] {

                min-height:
                        44px;
            }


            /* =====================================================
               RENT
            ===================================================== */

            .table tbody tr td[data-label="Rent (₹)"] {

                align-items:
                        flex-start;
            }


            .rent-options {

                display: flex;

                flex-direction: column;

                align-items: flex-end;

                gap: 3px;
            }


            .rent-options .badge-rent {

                margin: 0;

                font-size:
                        0.72rem;

                padding:
                        5px 9px;

                border-radius:
                        6px;
            }


            /* =====================================================
               AVAILABILITY
            ===================================================== */

            .table tbody tr td[data-label="Available"] {

                min-height:
                        54px;
            }


            .table tbody tr td[data-label="Available"]
            .form-check {

                margin: 0;
            }


            .form-check-input {

                width:
                        42px;

                height:
                        22px;
            }


            /* =====================================================
               ACTIONS
            ===================================================== */

            .table tbody tr td[data-label="Actions"] {

                display: grid;

                grid-template-columns:
                    1fr 1fr;

                gap:
                        8px;

                padding:
                        13px 16px 16px;

                background:
                        rgba(0, 0, 0, 0.015) !important;
            }


            .table tbody tr td[data-label="Actions"]::before {

                display: none;
            }


            .table tbody tr td[data-label="Actions"]
            .btn-edit,

            .table tbody tr td[data-label="Actions"]
            .btn-bookings {

                width: 100%;

                min-height: 40px;

                margin: 0;

                padding:
                        9px 8px;

                justify-content:
                        center;

                border-radius:
                        8px;

                font-size:
                        0.76rem;
            }


            /* =====================================================
               NOTIFICATION
            ===================================================== */

            .notif-dot {

                top:
                        -6px;

                right:
                        -5px;
            }


            /* =====================================================
               EMPTY STATE
            ===================================================== */

            .table tbody tr:has(.empty-state) {

                display: block;

                margin: 0;

                padding: 0;

                background:
                        transparent;

                border: none;

                box-shadow: none;
            }


            .table tbody tr:has(.empty-state) td {

                display: block;

                padding:
                        45px 15px;

                border: none !important;

                text-align:
                        center;
            }


            .table tbody tr:has(.empty-state) td::before {

                display: none;
            }


            .empty-state {

                padding:
                        25px 10px;
            }


            /* =====================================================
               ADD PROPERTY
            ===================================================== */

            .text-center.mt-4.mb-5 {

                margin-top:
                        20px !important;

                margin-bottom:
                        30px !important;
            }


            .btn-add {

                width:
                        100%;

                justify-content:
                        center;

                padding:
                        13px 20px;

                border-radius:
                        10px;

                font-size:
                        0.88rem;
            }
        }


        /* =========================================================
           VERY SMALL PHONES
        ========================================================= */

        @media (max-width: 380px) {

            .table tbody {

                gap:
                        13px;
            }


            .table tbody tr td {

                padding-left:
                        13px;

                padding-right:
                        13px;

                gap:
                        10px;
            }


            .table tbody tr td[data-label="Actions"] {

                padding-left:
                        13px;

                padding-right:
                        13px;
            }


            .table tbody tr td[data-label="Actions"]

</head>

<script

<script>


    /* =========================================================
       THEME TOGGLE
    ========================================================= */

    const toggleBtn =
        document.getElementById('themeToggle');

    const themeIcon =
        document.getElementById('themeIcon');

    const html =
        document.documentElement;


    /* Load saved theme */

    const saved =
        localStorage.getItem('sh-theme') || 'light';


    applyTheme(saved);



    /* Toggle */

    toggleBtn.addEventListener(
        'click',
        () => {

            const next =
                html.dataset.theme === 'dark'
                    ? 'light'
                    : 'dark';

            applyTheme(next);

            localStorage.setItem(
                'sh-theme',
                next
            );

        }
    );



    /* =========================================================
       APPLY THEME
    ========================================================= */

    function applyTheme(theme) {

        html.dataset.theme =
            theme;


        themeIcon.className =
            theme === 'dark'
                ? 'bi bi-sun-fill'
                : 'bi bi-moon-fill';


        toggleBtn.title =
            theme === 'dark'
                ? 'Switch to light mode'
                : 'Switch to dark mode';
    }

</script>
