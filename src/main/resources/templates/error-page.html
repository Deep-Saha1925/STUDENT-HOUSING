<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <!-- These were missing entirely before, so the back button rendered as an
         unstyled default link with no icon glyph at all. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 80px 24px 24px;
        }
        .btn-back {
            position: fixed;
            top: 18px; left: 18px;
        }
        @media (max-width: 575px) {
            .btn-back { top: 12px; left: 12px; padding: 6px 12px; font-size: 0.85rem; }
            body { padding-top: 64px; }
        }
    </style>
</head>
<body>
<a href="javascript:history.back()" class="btn btn-secondary btn-back">
    <i class="bi bi-arrow-left-circle"></i> Back
</a>

<h2 style="color:red;">Error</h2>
<p th:text="${errorMessage}">Something went wrong!</p>
</body>
</html>
