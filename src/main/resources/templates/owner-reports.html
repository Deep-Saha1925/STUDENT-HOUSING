<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Reports</title>
    <th:block th:replace="~{fragments/report-ui :: styles}"></th:block>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid d-flex align-items-center gap-3">
        <span class="navbar-brand">Student Housing</span>
        <a th:href="@{'/properties/owner/' + ${owner.id}}" class="btn-nav ms-auto">
            <i class="bi bi-arrow-left"></i> My Properties
        </a>
    </div>
</nav>

<div class="container py-4" style="max-width: 1000px;">

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-1">
        <h2 class="page-title mb-0">My Reports</h2>
        <button class="btn-accent" type="button" data-bs-toggle="collapse" data-bs-target="#newReport">
            <i class="bi bi-plus-lg"></i> New report
        </button>
    </div>
    <p class="text-muted-2 mb-4">Tell the admin about maintenance, property issues or disputes. They can reply here or ask for more info.</p>

    <div th:if="${param.error}" class="alert alert-danger py-2">Subject (max 150) and details (max 2000) are required.</div>

    <!-- New report form -->
    <div class="collapse mb-4" id="newReport">
        <div class="panel">
            <form th:action="@{/owner/reports}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select">
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Property <span class="text-muted-2">(optional)</span></label>
                    <select name="propertyId" class="form-select">
                        <option value="">— Not about a specific property —</option>
                        <option th:each="p : ${properties}" th:value="${p.id}" th:text="${p.title}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject" class="form-control" maxlength="150" required
                           placeholder="e.g. Water supply down from tomorrow">
                </div>
                <div class="col-12">
                    <label class="form-label">Details</label>
                    <textarea name="description" class="form-control" rows="4" maxlength="2000" required></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn-accent"><i class="bi bi-send"></i> Send to admin</button>
                </div>
            </form>
        </div>
    </div>

    <!-- My reports -->
    <div class="panel">
        <div th:if="${reports.isEmpty()}" class="text-muted-2">You haven't sent any reports yet.</div>
        <div class="table-responsive" th:if="${!reports.isEmpty()}">
            <table class="table align-middle mb-0">
                <thead><tr><th>Subject</th><th>Type</th><th>Status</th><th>Last update</th></tr></thead>
                <tbody>
                <tr th:each="r : ${reports}">
                    <td>
                        <span class="dot-unread" th:if="${r.ownerUnread}" title="New reply from admin"></span>
                        <a class="row-link" th:href="@{'/owner/reports/' + ${r.id}}" th:text="${r.subject}"></a>
                        <div class="text-muted-2" th:if="${r.propertyTitle != null}" th:text="${r.propertyTitle}"></div>
                    </td>
                    <td th:text="${r.type.label}"></td>
                    <td><span th:class="'st st-' + ${r.status}" th:text="${r.status.label}"></span></td>
                    <td class="text-muted-2" th:text="${#temporals.format(r.updatedAt, 'dd MMM yyyy, HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
