<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!-- Shared look for the report pages. Use inside <head>:
     <th:block th:replace="~{fragments/report-ui :: styles}"></th:block> -->
<th:block th:fragment="styles">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --accent: #ff5e62; --accent-2: #ff9966;
            --bg: #faf7f4; --card-bg: #fff; --text: #1a1a1a; --text-muted: #777;
            --border: rgba(0,0,0,0.08); --nav-bg: #1a1a1a; --shadow: 0 4px 24px rgba(0,0,0,0.07);
        }
        [data-theme="dark"] {
            --bg: #111112; --card-bg: #1e1e22; --text: #f0ede8; --text-muted: #888;
            --border: rgba(255,255,255,0.07); --nav-bg: #0d0d0e; --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .navbar { background: var(--nav-bg) !important; padding: 14px 28px; }
        .navbar-brand { font-family: 'DM Serif Display', serif; color: #f0ede8 !important; }
        .btn-nav {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: #fff !important; padding: 7px 14px; font-size: .82rem; border-radius: 8px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        }
        h2.page-title { font-family: 'DM Serif Display', serif; font-weight: 400; }
        .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
        .text-muted-2 { color: var(--text-muted); font-size: .82rem; }
        .form-control, .form-select { background: var(--bg); color: var(--text); border-color: var(--border); }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(255,94,98,.15); background: var(--bg); color: var(--text); }
        .btn-accent { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; border: 0; font-weight: 600; padding: 9px 20px; border-radius: 9px; }
        .btn-accent:hover { color: #fff; opacity: .92; }
        .table > :not(caption) > * > * { background: transparent; color: var(--text); border-color: var(--border); }
        a.row-link { color: var(--text); text-decoration: none; font-weight: 600; }
        a.row-link:hover { color: var(--accent); }
        .dot-unread { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 6px; }

        /* status chips */
        .st { font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
        .st-NEW          { background: #e8f1ff; color: #1d4ed8; }
        .st-UNDER_REVIEW { background: #fff4d6; color: #92600a; }
        .st-NEED_INFO    { background: #ffe9d6; color: #c2410c; }
        .st-APPROVED     { background: #dcfce7; color: #15803d; }
        .st-REJECTED     { background: #ffe3e3; color: #b42318; }

        /* conversation thread */
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
        .msg .who { font-size: .76rem; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); }
        .msg .body { white-space: pre-wrap; word-break: break-word; font-size: .92rem; }
        .msg-owner { background: var(--bg); margin-right: auto; }
        .msg-admin { background: rgba(255,94,98,.08); margin-left: auto; border-color: rgba(255,94,98,.25); }
    </style>
    <script>document.documentElement.dataset.theme = localStorage.getItem('sh-theme') || 'light';</script>
</th:block>
</head>
<body></body>
</html>
