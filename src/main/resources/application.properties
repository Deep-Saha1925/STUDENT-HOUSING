spring.application.name=StudentHousing

# Render (and most PaaS hosts) assign the port dynamically via $PORT and expect
# the app to bind to it. Defaults to 8080 locally, where $PORT isn't set.
server.port=${PORT:8080}

# Database — values come from the environment (see .env.example).
# Locally: springboot3-dotenv loads them from a gitignored .env file.
# In prod: the host (Render/Railway/Docker/etc.) sets real env vars.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# Tomcat
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=60000

# File uploads — Spring Boot defaults (1MB/file, 10MB/request) are far too small
# for real property photos; a single phone photo is often 3-8MB. Exceeding these
# throws before the controller runs, surfacing as a bare 400 error page.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.cache=true

# Cloudinary — same idea, real values live in .env / real env vars, never in this file.
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}
# i18n (English / Bengali) - see config/I18nConfig.java
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Security hardening ---
# Trust the X-Forwarded-* headers from the host's proxy (Render etc.) so the app knows it is
# on HTTPS and sees the real client IP (used by login throttling).
server.forward-headers-strategy=framework
# Session cookie: not readable by JavaScript, not sent on cross-site POSTs.
# Set COOKIE_SECURE=true in production (HTTPS) so the cookie is never sent over plain HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=60m
# Never put exception text or stack traces in the default error page.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
