<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Search Properties</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --accent:       #ff5e62;
      --accent-2:     #ff9966;
      --bg:           #faf7f4;
      --card-bg:      #ffffff;
      --text:         #1a1a1a;
      --text-muted:   #777;
      --border:       rgba(0,0,0,0.08);
      --input-bg:     #f5f2ef;
      --input-border: #e0dbd5;
      --placeholder:  #aaa;
      --shadow:       0 4px 24px rgba(0,0,0,0.07);
    }
    [data-theme="dark"] {
      --bg:           #111112;
      --card-bg:      #1e1e22;
      --text:         #f0ede8;
      --text-muted:   #888;
      --border:       rgba(255,255,255,0.07);
      --input-bg:     #26252a;
      --input-border: #35343a;
      --placeholder:  #555;
      --shadow:       0 4px 24px rgba(0,0,0,0.4);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
      transition: background 0.35s, color 0.35s;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: -100px; right: -100px;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,94,98,0.07) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -80px; left: -80px;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,153,102,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── Sticky top bar ── */
    .top-bar {
      position: sticky;
      top: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      z-index: 999;
      transition: background 0.35s;
    }

    .btn-back {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--card-bg); border: 1.5px solid var(--border);
      color: var(--text-muted); padding: 8px 14px;
      font-size: 0.83rem; font-weight: 500; border-radius: 8px;
      text-decoration: none; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif; white-space: nowrap;
    }
    .btn-back:hover { color: var(--text); border-color: var(--text); background: var(--input-bg); }

    .theme-toggle {
      width: 38px; height: 38px;
      border-radius: 9px; border: 1.5px solid var(--border);
      background: var(--card-bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem;
      transition: all 0.25s ease; box-shadow: var(--shadow); flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: rotate(20deg); }

    /* ── Titles ── */
    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 400; color: var(--text); letter-spacing: -0.5px;
      text-align: center; margin: 22px 0 6px; position: relative; z-index: 1;
    }
    .page-subtitle {
      text-align: center; color: var(--text-muted); font-size: 0.87rem;
      font-weight: 300; margin-bottom: 22px; position: relative; z-index: 1;
    }

    /* ── Search form ── */
    .search-wrap {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow);
      max-width: 820px; margin: 0 auto 12px;
      position: relative; z-index: 1; transition: background 0.35s;
    }
    .search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-wrap .form-control {
      background: var(--input-bg) !important;
      border: 1.5px solid var(--input-border) !important;
      color: var(--text) !important; border-radius: 9px !important;
      padding: 10px 14px !important; font-size: 0.87rem;
      font-family: 'DM Sans', sans-serif; flex: 1; min-width: 120px;
      transition: border-color 0.2s, background 0.35s, box-shadow 0.2s;
    }
    .search-wrap .form-control::placeholder { color: var(--placeholder) !important; }
    .search-wrap .form-control:focus {
      outline: none !important; border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(255,94,98,0.1) !important;
      background: var(--card-bg) !important;
    }
    .btn-search {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border: none; color: #fff; padding: 10px 20px; font-size: 0.87rem;
      font-weight: 600; border-radius: 9px; cursor: pointer;
      transition: all 0.2s; display: inline-flex; align-items: center;
      gap: 7px; font-family: 'DM Sans', sans-serif; white-space: nowrap;
      justify-content: center;
    }
    .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }

    /* ── OR divider ── */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      max-width: 820px; margin: 0 auto 12px;
      position: relative; z-index: 1;
      color: var(--text-muted); font-size: 0.78rem;
    }
    .or-divider::before, .or-divider::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── Near Me ── */
    .nearme-wrap {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow);
      max-width: 820px; margin: 0 auto 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      position: relative; z-index: 1; transition: background 0.35s;
    }
    .nearme-wrap label { font-size: 0.83rem; color: var(--text-muted); white-space: nowrap; }
    .radius-select {
      background: var(--input-bg) !important; border: 1.5px solid var(--input-border) !important;
      color: var(--text) !important; border-radius: 9px !important;
      padding: 8px 12px !important; font-size: 0.85rem;
      font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.35s;
    }
    .btn-nearme {
      background: transparent; border: 1.5px solid var(--accent); color: var(--accent);
      padding: 9px 18px; font-size: 0.87rem; font-weight: 600; border-radius: 9px;
      cursor: pointer; transition: all 0.25s;
      display: inline-flex; align-items: center; gap: 7px;
      font-family: 'DM Sans', sans-serif; white-space: nowrap; justify-content: center;
    }
    .btn-nearme:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
    .btn-nearme.loading { opacity: 0.7; pointer-events: none; }
    #locationStatus { font-size: 0.79rem; color: var(--text-muted); }

    /* ── Map ── */
    #mapWrap {
      max-width: 820px; margin: 0 auto 24px; border-radius: 14px;
      overflow: hidden; box-shadow: var(--shadow);
      position: relative; z-index: 1; display: none;
    }
    #propertyMap { height: 340px; width: 100%; background: var(--input-bg); }

    /* Dark-mode friendly tiles: invert + hue-rotate so OSM tiles aren't blinding white */
    [data-theme="dark"] #propertyMap .leaflet-tile-pane {
      filter: invert(0.92) hue-rotate(180deg) brightness(0.95) contrast(0.9);
    }
    /* Keep markers/popups from being visually inverted along with the tiles */
    [data-theme="dark"] #propertyMap .leaflet-marker-pane,
    [data-theme="dark"] #propertyMap .leaflet-popup-pane,
    [data-theme="dark"] #propertyMap .leaflet-shadow-pane {
      filter: invert(0.92) hue-rotate(180deg);
    }

    /* Leaflet chrome themed to match the card design */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--card-bg) !important; color: var(--text) !important;
      box-shadow: var(--shadow) !important;
    }
    .leaflet-popup-content { font-family: 'DM Sans', sans-serif; color: var(--text); }
    .leaflet-container a.leaflet-popup-close-button { color: var(--text-muted) !important; }
    .leaflet-bar a {
      background: var(--card-bg) !important; color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .leaflet-bar a:hover { background: var(--input-bg) !important; }
    .leaflet-control-attribution {
      background: rgba(255,255,255,0.75) !important; color: #555 !important; font-size: 10px !important;
    }
    .map-pin-icon { cursor: pointer; }

    .map-overlay {
      position: absolute; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.06); backdrop-filter: blur(1px);
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
      color: var(--text); text-align: center; padding: 20px;
      pointer-events: none;
    }
    [data-theme="dark"] .map-overlay { background: rgba(0,0,0,0.35); }
    .map-overlay .spinner-border { width: 1.6rem; height: 1.6rem; color: var(--accent); }

    /* ── Result badge ── */
    .result-mode-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,94,98,0.1); color: var(--accent);
      border: 1px solid rgba(255,94,98,0.25);
      padding: 5px 13px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 600; margin-bottom: 16px;
    }

    /* ── Property cards ── */
    .property-card {
      border: 1px solid var(--border) !important;
      border-radius: 14px !important; box-shadow: var(--shadow) !important;
      background: var(--card-bg) !important;
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.35s !important;
      overflow: hidden !important;
    }
    .property-card:hover { transform: translateY(-5px) !important; box-shadow: 0 12px 32px rgba(0,0,0,0.1) !important; }
    [data-theme="dark"] .property-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.5) !important; }
    .property-img { width: 100%; height: 180px; object-fit: cover; }
    #propertyContainer { position: relative; z-index: 1; color: var(--text); }
    #propertyContainer .text-muted, #propertyContainer p { color: var(--text-muted) !important; }
    .property-card .card-body h5 { color: var(--text) !important; }
    .property-card .card-body p  { color: var(--text-muted) !important; }
    .property-card .card-body strong { color: var(--text) !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.8s linear infinite; }

    /* ── Mobile (≤575px) ── */
    @media (max-width: 575px) {
      .search-row { flex-direction: column; align-items: stretch; }
      .search-wrap .form-control { min-width: unset; width: 100%; }
      .btn-search { width: 100%; }
      .nearme-wrap { flex-direction: column; align-items: stretch; gap: 10px; }
      .btn-nearme { width: 100%; }
      #locationStatus { text-align: center; }
    }

    @keyframes pulseDot {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(2.6); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container animate__animated animate__fadeIn" style="position:relative;z-index:1;">

  <!-- ── Top bar ── -->
  <div class="top-bar">
    <a href="/student/dashboard" class="btn-back">
      <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <i class="bi bi-moon-fill" id="themeIcon"></i>
    </button>
  </div>

  <h2 class="page-title">Search Properties</h2>
  <p class="page-subtitle">Find affordable housing near your campus</p>

  <!-- ── Manual Search ── -->
  <div class="search-wrap">
    <form id="searchForm">
      <div class="search-row">
        <i class="bi bi-search text-muted d-none d-sm-block"></i>
        <input type="text"   class="form-control" id="cityInput" name="city"
               placeholder="Enter city / location" th:value="${city}">
        <input type="number" class="form-control" id="rentInput" name="rent"
               placeholder="Max Rent (₹)" th:value="${rent}">
        <select class="radius-select" id="rentalTypeSelect">
          <option value="" th:selected="${rentalType == null}">Any rental type</option>
          <option value="MONTHLY" th:selected="${rentalType == 'MONTHLY'}">Monthly only</option>
          <option value="DAILY" th:selected="${rentalType == 'DAILY'}">Daily only</option>
        </select>
        <button type="submit" class="btn-search">
          <i class="bi bi-search"></i> Search
        </button>
      </div>
    </form>
  </div>

  <div class="or-divider">or use your location</div>

  <!-- ── Near Me ── -->
  <div class="nearme-wrap">
    <i class="bi bi-geo-alt-fill" style="color:var(--accent);font-size:1.1rem;flex-shrink:0;"></i>
    <label>Search within:</label>
    <select class="radius-select" id="radiusSelect">
      <option value="2">2 km</option>
      <option value="5" selected>5 km</option>
      <option value="10">10 km</option>
      <option value="20">20 km</option>
    </select>
    <button class="btn-nearme" id="nearMeBtn" onclick="findNearMe()">
      <i class="bi bi-crosshair"></i> Find Near Me
    </button>
    <span id="locationStatus"></span>
  </div>

  <!-- Map now sits below the Near Me bar, so it never pushes the button when it appears -->
  <div id="mapWrap">
    <div id="propertyMap"></div>
  </div>

  <!-- ── Results ── -->
  <div id="propertyContainer">
    <div th:replace="~{fragments/property-list :: propertyList}"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const toggleBtn = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const html      = document.documentElement;
  applyTheme(localStorage.getItem('sh-theme') || 'light');
  toggleBtn.addEventListener('click', () => {
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next); localStorage.setItem('sh-theme', next);
  });
  function applyTheme(t) {
    html.dataset.theme = t;
    themeIcon.className = t === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    toggleBtn.title     = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("searchForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const city = document.getElementById("cityInput").value;
      const rent = document.getElementById("rentInput").value;
      const rentalType = document.getElementById("rentalTypeSelect").value;
      setStatus('');
      hideMap(); // manual search replaces "near me" mode — the old map/pins no longer apply
      showLoading();
      fetch(`/search?city=${encodeURIComponent(city)}&rent=${encodeURIComponent(rent)}&rentalType=${encodeURIComponent(rentalType)}`)
              .then(r => r.text()).then(html => setResults(html, null))
              .catch(err => console.error("Search error:", err));
    });
  });

  function findNearMe() {
    if (!navigator.geolocation) { setStatus('❌ Geolocation not supported.'); return; }
    const btn = document.getElementById('nearMeBtn');
    btn.classList.add('loading');
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Locating…';
    setStatus('Getting your location…');
    navigator.geolocation.getCurrentPosition(
            pos => {
              const { latitude: lat, longitude: lng } = pos.coords;
              const radius = Number(document.getElementById('radiusSelect').value);
              renderNearbyMap(lat, lng, radius);
              setStatus(`📍 Found you! Searching within ${radius} km…`);
              showLoading();
              fetch(`/properties/nearby?lat=${lat}&lng=${lng}&radius=${radius}`)
                      .then(r => r.text())
                      .then(html => {
                        setResults(html, radius); setStatus('');
                        btn.classList.remove('loading');
                        btn.innerHTML = '<i class="bi bi-crosshair"></i> Find Near Me';
                      })
                      .catch(() => {
                        setStatus('❌ Something went wrong. Try again.');
                        btn.classList.remove('loading');
                        btn.innerHTML = '<i class="bi bi-crosshair"></i> Find Near Me';
                      });
            },
            err => {
              btn.classList.remove('loading');
              btn.innerHTML = '<i class="bi bi-crosshair"></i> Find Near Me';
              setStatus(err.code === err.PERMISSION_DENIED
                      ? '❌ Location permission denied.' : '❌ Could not get location. Try manual search.');
            },
            { timeout: 10000 }
    );
  }

  function showLoading() {
    document.getElementById('propertyContainer').innerHTML = `
      <div class="text-center py-5">
        <div class="spinner-border" style="color:var(--accent);width:2rem;height:2rem;" role="status"></div>
        <p class="mt-3" style="color:var(--text-muted);font-size:0.88rem;">Finding properties…</p>
      </div>`;
  }
  function setResults(htmlContent, radius) {
    const badge = radius ? `<div class="result-mode-badge">
      <i class="bi bi-geo-alt-fill"></i> Showing properties within ${radius} km of your location
    </div>` : '';
    document.getElementById('propertyContainer').innerHTML = badge + htmlContent;
  }
  function setStatus(msg) { document.getElementById('locationStatus').textContent = msg; }

  function hideMap() {
    document.getElementById('mapWrap').style.display = 'none';
    if (map) {
      markerLayer.clearLayers();
      if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
    }
  }
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let map, radiusCircle;
  const markerLayer = L.layerGroup();

  function groupKey(lat, lng) {
    // ~11m precision (4 decimal places) — treats same-building listings as one pin
    return lat.toFixed(4) + ',' + lng.toFixed(4);
  }

  function setMapOverlay(mode) {
    // mode: 'loading' | 'empty' | null
    const wrap = document.getElementById('mapWrap');
    let overlay = wrap.querySelector('.map-overlay');
    if (overlay) overlay.remove();
    if (!mode) return;
    overlay = document.createElement('div');
    overlay.className = 'map-overlay';
    overlay.innerHTML = mode === 'loading'
            ? '<div><div class="spinner-border" role="status"></div><div class="mt-2">Loading nearby properties…</div></div>'
            : '<div><i class="bi bi-emoji-frown" style="font-size:1.3rem;"></i><div class="mt-2">No properties found in this area. Try a larger radius.</div></div>';
    wrap.appendChild(overlay);
  }

  function renderNearbyMap(userLat, userLng, radiusKm) {
    document.getElementById('mapWrap').style.display = 'block';

    if (!map) {
      // Give the map a real center/zoom at creation time. Leaflet reads the
      // container's size synchronously on init — if we call fitBounds/getBounds
      // on a circle before the map has a valid projection (e.g. right after
      // un-hiding the container in the same tick), it throws
      // "Cannot read properties of undefined (reading 'layerPointToLatLng')".
      map = L.map('propertyMap').setView([userLat, userLng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      markerLayer.addTo(map);
    }

    markerLayer.clearLayers();
    if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }

    // Force Leaflet to re-measure the container now that it's visible, and
    // wait a tick for the browser to actually finish that layout pass before
    // doing any bounds math on it.
    map.invalidateSize();

    requestAnimationFrame(() => {
      map.invalidateSize();

      radiusCircle = L.circle([userLat, userLng], {
        radius: radiusKm * 1000,
        color: '#ff5e62', fillColor: '#ff5e62', fillOpacity: 0.08, weight: 1.5
      }).addTo(map);

      // Fit to the actual circle bounds instead of guessing a zoom level —
      // this frames correctly whether the radius is 2km or 20km.
      map.fitBounds(radiusCircle.getBounds(), { padding: [24, 24] });

      L.marker([userLat, userLng], {
        zIndexOffset: 1000, // keep "you are here" above property pins that may share the spot
        icon: L.divIcon({
          className: '',
          html: `<div style="position:relative;width:16px;height:16px;">
               <div style="position:absolute;inset:0;border-radius:50%;background:rgba(43,108,255,0.35);animation:pulseDot 1.6s ease-out infinite;"></div>
               <div style="position:absolute;inset:3px;border-radius:50%;background:#2b6cff;border:2px solid #fff;box-shadow:0 0 0 2px rgba(43,108,255,0.4);"></div>
             </div>`,
          iconSize: [16, 16], iconAnchor: [8, 8]
        })
      }).addTo(markerLayer).bindPopup('You are here');

      setMapOverlay('loading');
      fetch(`/properties/nearby/map?lat=${userLat}&lng=${userLng}&radius=${radiusKm}`)
              .then(r => r.json())
              .then(properties => {
                plotGroupedMarkers(properties);
                setMapOverlay(properties.length === 0 ? 'empty' : null);
              })
              .catch(err => {
                console.error('Map fetch error:', err);
                setMapOverlay('empty');
              });
    });
  }

  function makePinIcon(count, anyAvailable) {
    const color = anyAvailable ? '#ff5e62' : '#9ca3af';
    const size = 34;
    const html = `
    <div class="map-pin-icon" style="position:relative;width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" viewBox="0 0 34 34"
           style="filter:drop-shadow(0 3px 4px rgba(0,0,0,0.35));">
        <path d="M17 1C9.8 1 4 6.8 4 14c0 9.5 13 18.5 13 18.5S30 23.5 30 14C30 6.8 24.2 1 17 1z"
              fill="${color}" stroke="#fff" stroke-width="1.5"/>
        <circle cx="17" cy="14" r="6.5" fill="#fff"/>
      </svg>
      ${count > 1 ? `<div style="position:absolute;top:-4px;right:-2px;background:#1a1a1a;color:#fff;
             font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
             display:flex;align-items:center;justify-content:center;border:2px solid #fff;">${count}</div>` : ''}
    </div>`;
    return L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size / 2, size] });
  }

  function plotGroupedMarkers(properties) {
    const groups = {};
    properties.forEach(p => {
      const key = groupKey(p.latitude, p.longitude);
      (groups[key] = groups[key] || []).push(p);
    });

    Object.values(groups).forEach(group => {
      const { latitude, longitude } = group[0];
      const count = group.length;
      const anyAvailable = group.some(p => p.available);
      const icon = makePinIcon(count, anyAvailable);
      const marker = L.marker([latitude, longitude], { icon }).addTo(markerLayer);

      if (count === 1) {
        marker.on('click', () => { window.location.href = `/properties/${group[0].id}`; });
        marker.bindTooltip(group[0].title, { direction: 'top', offset: [0, -30] });
      } else {
        const popupHtml = `<div style="font-family:'DM Sans',sans-serif;min-width:190px;">
        <strong>${count} listings here</strong>
        ${group.map(p => `
          <div style="margin-top:6px;padding-top:6px;border-top:1px solid #eee;">
            <a href="/properties/${p.id}" style="text-decoration:none;color:#ff5e62;font-weight:600;font-size:0.85rem;">${p.title}</a>
            <div style="font-size:0.78rem;color:#777;">₹${p.monthlyRent}/mo ${p.available ? '' : '· unavailable'}</div>
          </div>`).join('')}
      </div>`;
        marker.bindPopup(popupHtml);
      }
    });
  }
</script>

</body>
</html>
